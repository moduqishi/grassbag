name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.4'

jobs:
  release_scripts:
    name: Release Scripts (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run test:release

  dsh_gbridge:
    name: dsh-gbridge (npm test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - working-directory: packages/dsh-gbridge
        run: npm test

  gbridge_client_dart:
    name: gbridge-client-dart (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - working-directory: packages/gbridge-client-dart
        run: |
          dart pub get
          dart analyze
          dart test

  flutter_app:
    name: Flutter App (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache-key: flutter-pub-:os:-:channel:-${{ env.FLUTTER_VERSION }}-:arch:-${{ hashFiles('app/pubspec.lock') }}
      - working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  runtime_shims:
    name: Android Runtime Shims (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test runtime/shims/*.test.mjs

  android_build:
    name: Android Kotlin & APK Build (arm64 debug)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache-key: flutter-pub-:os:-:channel:-${{ env.FLUTTER_VERSION }}-:arch:-${{ hashFiles('app/pubspec.lock') }}
      - name: Build lean runtime overlays for Android assets
        run: bash runtime/scripts/build-runtime-bundle.sh --thin --github-repo "${{ github.repository }}"
      - name: Compile Kotlin & build Android ARM64 Debug APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --debug --target-platform android-arm64
