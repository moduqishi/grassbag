name: grassbag
description: GrassBag — Native Liquid Glass client for DeepSeek Harness (DSH) on Android phones & tablets.
publish_to: none
version: 0.2.4+15
environment:
  sdk: ^3.6.0
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  liquid_glass_widgets: ^1.19.0
  xterm: ^4.0.0
  webview_flutter: ^4.10.0
  shared_preferences: ^2.3.5
  gbridge_client:
    path: ../packages/gbridge-client-dart
  mobile_scanner: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  shaders:
    - shaders/kyant_liquid_glass.frag
