    <rect x="44" y="208" width="1112" height="74" rx="18" fill="#F5F3FF" fill-opacity="0.86" stroke="#B7AFF2" stroke-width="1.2"/>
    <text x="68" y="234" fill="#5445B5" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.8">02 · PURE DART PROTOCOL SDK  (packages/gbridge-client-dart)</text>
    <text x="68" y="262" fill="#2A3152" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13.5">
