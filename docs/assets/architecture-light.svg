      <text x="298" y="147" fill="#52708A" font-size="11" font-weight="400">文件树 · Git Diff · xterm PTY</text>

      <rect x="492" y="110" width="206" height="46" rx="12" fill="#F0F7FC" stroke="#CCE2F2"/>
      <text x="510" y="130">Schemastery &amp; SDUI</text>
      <text x="510" y="147" fill="#52708A" font-size="11" font-weight="400">动态设置 · 插件市场 · 官方逃生舱</text>

      <rect x="714" y="110" width="206" height="46" rx="12" fill="#F0F7FC" stroke="#CCE2F2"/>
