    </text>

    <path d="M 320 282 L 320 314" stroke="#296E96" stroke-width="1.6" marker-end="url(#arrowL)"/>
    <path d="M 880 282 L 880 314" stroke="#296E96" stroke-width="1.6" marker-end="url(#arrowL)"/>

