    <text x="656" y="405" fill="#7D623C" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5">局域网扫描 · 一键装桥 · 30 天 Cookie 授权</text>

    <rect x="894" y="362" width="238" height="60" rx="12" fill="#FFFFFF" stroke="#F0D8B1"/>
    <text x="910" y="384" fill="#3B2911" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600">零侵入 dsh-gbridge 插件</text>
    <text x="910" y="405" fill="#7D623C" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5">packages/dsh-gbridge · 标准 Cordis 扩展</text>

    <rect x="640" y="434" width="492" height="54" rx="12" fill="#FCEFD9" stroke="#E9C68E"/>
    <text x="656" y="457" fill="#3D280C" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600">GitHub Actions 双分支自增发版（main ↔ release-version）</text>
    <text x="656" y="476" fill="#7E5D2D" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5">自动拉取离线容器包 → 递增 versionName/versionCode → 签名 APK → 发布 Release</text>

    <rect x="0.6" y="0.6" width="1198.8" height="538.8" rx="23.4" stroke="#B6D3E8" stroke-width="1.2"/>
  </g>
