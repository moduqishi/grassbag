    <text x="338" y="405" fill="#467265" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5">四分离持久卷 · 自动健康检查与回滚</text>

    <rect x="68" y="434" width="492" height="54" rx="12" fill="#E1F4EC" stroke="#8BD6BE"/>
