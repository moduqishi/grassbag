    <text x="330" y="44" fill="#4E6D86" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13">Zero-Patch Cordis Bridge · Offline ARM64 Container · Dual-Mode Remote Transport</text>

    <!-- LAYER 1 -->
    <rect x="44" y="68" width="1112" height="106" rx="20" fill="#FFFFFF" fill-opacity="0.82" stroke="#8AC2E6" stroke-width="1.2"/>
    <text x="68" y="96" fill="#21638A" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.8">01 · FLUTTER NATIVE LIQUID GLASS CLIENT  (app/)</text>
    <g font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#13293D">
