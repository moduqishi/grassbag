    <text x="84" y="476" fill="#3B6D5F" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11.5">零侵入 Cordis 插件加载 · Android 无障碍 / 剪贴板 / 语音 / 相机 / 文件系统双向桥接</text>

    <!-- LAYER 3 RIGHT -->
    <rect x="616" y="318" width="540" height="190" rx="20" fill="#FFF9EF" fill-opacity="0.94" stroke="#E9C68E" stroke-width="1.2"/>
    <text x="640" y="346" fill="#9E6216" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.8">03B · 远程主机互联 &amp; 双分支自动发版体系</text>

    <rect x="640" y="362" width="238" height="60" rx="12" fill="#FFFFFF" stroke="#F0D8B1"/>
